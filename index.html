<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantaloons</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone-shell">
      <header class="browser-header">
        <div class="status-bar">
          <div class="time">11:22</div>
          <div class="status-icons">
            <span class="signal-bars" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </span>
            <span class="wifi" aria-hidden="true"></span>
            <span class="battery" aria-hidden="true"><span class="battery-level"></span></span>
            <span class="network">5G</span>
            <span class="signal-text">66</span>
          </div>
        </div>

        <div class="address-row">
          <button class="star-btn" aria-label="Favorite">✦</button>
          <div class="site-url">pantaloons.com</div>
          <button class="share-btn" aria-label="Share">⤴</button>
        </div>
      </header>

      <main class="main-screen">
        <div class="gemini-banner">Create an image with Gemini</div>

        <div class="brand-bar">
          <button class="menu-btn" aria-label="Menu">☰</button>
          <div class="brand-name">pantaloons</div>
          <button class="bag-btn" aria-label="Bag">🛍</button>
        </div>

        <div class="search-bar">
          <span class="search-icon">⌕</span>
          <span class="search-text">Search for brands, products and more.</span>
          <span class="search-pipe"></span>
          <button class="filter-btn" aria-label="Filters">▦</button>
        </div>

        <nav class="category-tabs" aria-label="Categories">
          <span>Home</span>
          <span>Women</span>
          <span>Men</span>
          <span>Kids</span>
        </nav>

        <section class="hero-banner">
          <img
            src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=1200&q=80"
            alt="Fashion models wearing ethnic wear"
          />
          <div class="hero-overlay">
            <div class="hero-text">New In</div>
            <div class="hero-cta">SHOP NOW</div>
          </div>
        </section>

        <div class="promo-strip">
          <span>Discover what’s new! Tap to explore the latest way to shop with Pantaloons</span>
          <button aria-label="Close">×</button>
        </div>

        <nav class="bottom-nav" aria-label="Mobile navigation">
          <div class="nav-item active">
            <span class="nav-ico">⌂</span>
            <span>Home</span>
          </div>
          <div class="nav-item">
            <span class="nav-ico">♡</span>
            <span>Wishlist</span>
          </div>
          <div class="nav-item">
            <span class="nav-ico">◫</span>
            <span>Instore</span>
          </div>
          <div class="nav-item">
            <span class="nav-ico">⌕</span>
            <span>Search</span>
          </div>
          <div class="nav-item">
            <span class="nav-ico">◔</span>
            <span>Profile</span>
          </div>
        </nav>

        <div class="toolbar-footer">
          <button class="nav-arrow" aria-label="Previous">←</button>
          <button class="nav-arrow" aria-label="Next">→</button>
          <button class="plus-btn" aria-label="More">＋</button>
          <button class="badge-pill" aria-label="Notifications">5</button>
          <button class="more-btn" aria-label="Options">•••</button>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="E-commerce website with customer support and contact information."
    />
    <title>ecommerce</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone-shell">
      <header class="browser-header">
        <div class="status-bar">
          <div class="time">10:50</div>
          <div class="status-icons" aria-label="device status">
            <span class="signal-bars" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </span>
            <span class="wifi" aria-hidden="true"></span>
            <span class="battery" aria-hidden="true">
              <span class="battery-level"></span>
            </span>
          </div>
        </div>

        <div class="address-row">
          <button class="close-btn" aria-label="Close">×</button>
          <div class="tab-icon" aria-hidden="true">◩</div>
          <div class="address-box" aria-label="Address bar">
            <span>dprakash207.github.io</span>
          </div>
          <button class="action-btn" aria-label="Share page">⇪</button>
          <button class="menu-btn" aria-label="More options">⋯</button>
        </div>
      </header>

      <main class="content" aria-label="Page content">
        <section class="hero-copy">
          <h1>ecommerce</h1>
          <div class="divider" aria-hidden="true"></div>
          <p>E-commerce website with customer support and contact information</p>
        </section>

        <section class="photo-gallery" aria-label="Featured products">
          <div class="section-heading">
            <span>Fresh picks</span>
            <h2>Trending Now</h2>
          </div>

          <div class="gallery-grid">
            <article class="gallery-card large">
              <img
                src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80"
                alt="Smart wristwatch on a dark background"
              />
              <div class="card-info">
                <strong>Smartwatch</strong>
                <small>From $89</small>
              </div>
            </article>

            <article class="gallery-card">
              <img
                src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=900&q=80"
                alt="Modern home decor product"
              />
              <div class="card-info">
                <strong>Home care</strong>
                <small>New arrival</small>
              </div>
            </article>

            <article class="gallery-card">
              <img
                src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80"
                alt="Running sneakers on a neutral background"
              />
              <div class="card-info">
                <strong>Footwear</strong>
                <small>Top seller</small>
              </div>
            </article>
          </div>
        </section>
      </main>

      <nav class="bottom-bar" aria-label="Bottom navigation">
        <button class="nav-arrow left" aria-label="Previous page">‹</button>
        <button class="nav-arrow right" aria-label="Next page">›</button>

        <button class="ask-pill" type="button" aria-label="Ask">
          <span class="ask-icon" aria-hidden="true">◌</span>
          Ask
        </button>

        <button class="home-btn" aria-label="Home">⌂</button>
        <div class="notification-badge" aria-label="Notifications">17</div>
      </nav>
    </div>

    <script src="script.js"></script>
  </body>
</html>
